# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: T3 Code
author: Nick Schuch
description: Adds the T3 Code web UI, served on port 3773 by the environment file's entrypoint.
sourceUrl: https://github.com/nickschuch/sbx

# The kit only installs T3 Code (t3code.dockerfile) and exposes its port. A
# mixin can't set the launch command, so sbxenv.yaml's `entrypoint` runs
# `t3 serve` in the foreground; see the README.
capabilities:
  - type: com.docker.sandbox/port@1
    config:
      name: t3code
      container: 3773
